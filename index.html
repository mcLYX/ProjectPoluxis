<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1120" />
    <title>Project:Poluxis - 简约风格3D音乐节奏游戏</title>
    <script src="/capability.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0a0d12] text-white overflow-hidden select-none font-['Inter',sans-serif]">
    <div id="root"></div>
    <script>
      // HarmonyOS 4（M99 内核）双指缩放手势兜底：user-scalable=no 与
      // touch-action: pan-x pan-y 在该内核可能不生效，这里在 React 挂载前
      // 用一个非被动 touchmove 监听器阻止多指手势（双指缩放/旋转）。
      // 必须在 React 挂载前注册，故放在 index.html（passive:false 才能 preventDefault）。
      (function () {
        document.addEventListener('touchmove', function (e) {
          if (e.touches && e.touches.length > 1) e.preventDefault();
        }, { passive: false });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
